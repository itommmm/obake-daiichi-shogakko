<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>おばけ第一小学校</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* レイアウト: 全画面canvas＋DOMのボタン・画面遷移。夜の学校×ネオン紫の単一テーマ */
:root{
  color-scheme:dark;
  --night:#0d0a1f;
  --panel:rgba(22,12,44,.82);
  --violet:#a65cff;
  --cyan:#5fe3ff;
  --pink:#ff5fb8;
  --gold:#ffd23f;
  --chalk:#f4f1ff;
  --ink:#1a0b25;
  --display:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--chalk)}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;display:block;touch-action:none;cursor:none}
.sa{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);visibility:hidden}
button{font-family:var(--body);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

/* スキルボタン */
#skills{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:clamp(8px,1.6vw,18px);z-index:5}
.sk{--cd:0;position:relative;width:clamp(58px,7.2vw,86px);aspect-ratio:1;border:none;background:none;padding:0;color:var(--chalk);touch-action:none}
.sk .hex{position:absolute;inset:0;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:linear-gradient(160deg,#3a2a66,#170c33);display:grid;place-items:center}
.sk .hex::before{content:"";position:absolute;inset:3px;clip-path:inherit;background:radial-gradient(circle at 50% 35%,var(--glow),#1b0f3a 70%)}
.sk svg{position:relative;width:48%;height:48%;filter:drop-shadow(0 0 6px var(--glow))}
.sk .cool{position:absolute;inset:0;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:conic-gradient(rgba(8,4,20,.78) calc(var(--cd)*360deg),transparent 0)}
.sk .key{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);background:#fff;color:var(--ink);font:900 11px/1 var(--body);padding:3px 5px;border-radius:4px}
.sk .lbl{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:900 clamp(10px,1.3vw,14px)/1.4 var(--body);white-space:nowrap;text-shadow:0 0 6px #000,0 0 2px #000}
.sk.ready .hex{background:linear-gradient(160deg,#fff,var(--glow))}
.sk.ready{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#sLight{--glow:#ffe9a8}#sBell{--glow:#ffc93c}#sSp{--glow:#c06bff}

/* 右上の小ボタン */
#tools{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);display:flex;flex-direction:column;gap:8px;z-index:6}
.tb{width:40px;height:40px;border-radius:12px;border:2px solid rgba(166,92,255,.7);background:var(--panel);color:var(--chalk);font:900 16px/1 var(--body);display:grid;place-items:center}

/* 画面（タイトル・結果・ポーズ） */
.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 40%,rgba(40,16,80,.35),rgba(6,3,16,.82));overflow:auto}
.card{width:min(820px,100%);display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(12px,3vw,32px);align-items:center}
.logo{text-align:center}
.logo .ruby{font:900 clamp(12px,1.8vw,18px)/1 var(--body);letter-spacing:.6em;color:#d8c6ff;margin-left:.6em}
.logo h1{white-space:nowrap;margin:.2em 0 .1em;font:400 clamp(28px,4.6vw,58px)/1.05 var(--display);color:#fff;-webkit-text-stroke:2px #5a1fb0;paint-order:stroke fill;text-shadow:0 4px 0 #2b0a5c,0 0 24px rgba(166,92,255,.9)}
.logo .sub{display:inline-block;font:900 clamp(14px,2.2vw,22px)/1 var(--body);background:#2b0a5c;border:2px solid var(--violet);padding:.45em 1em;border-radius:999px;letter-spacing:.12em}
.ghosts{display:flex;justify-content:center;gap:14px;margin-top:14px;font-size:clamp(11px,1.4vw,13px);color:#cdb8ff;flex-wrap:wrap}
.ghosts span{display:inline-flex;align-items:center;gap:4px}
.ghosts i{width:10px;height:10px;border-radius:50%;display:inline-block}
.menu{background:var(--panel);border:2px solid rgba(166,92,255,.6);border-radius:18px;padding:clamp(12px,2.4vw,22px);display:grid;gap:10px;box-shadow:0 0 30px rgba(120,60,255,.35)}
.menu h2{margin:0;font:900 clamp(14px,1.8vw,17px)/1.3 var(--body);color:var(--gold)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:2px solid #4b3487;background:#1c1040;color:var(--chalk);border-radius:12px;padding:10px 4px;font:900 clamp(13px,1.7vw,16px)/1.2 var(--body)}
.mode small{display:block;font-weight:500;font-size:.72em;color:#bda9f0;margin-top:3px}
.mode[aria-pressed="true"]{border-color:var(--gold);background:#3a2370;box-shadow:0 0 14px rgba(255,210,63,.4)}
.go{border:none;border-radius:14px;padding:14px;font:400 clamp(20px,3vw,28px)/1 var(--display);color:var(--ink);background:linear-gradient(180deg,#fff27a,#ffb22e);box-shadow:0 5px 0 #a8580c,0 0 24px rgba(255,200,60,.5)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #a8580c}
.how{font-size:clamp(11px,1.35vw,13px);line-height:1.65;color:#d9ccff;margin:0;padding-left:1.1em}
.how b{color:#fff}
.best{font-size:13px;color:#cdb8ff;text-align:center}
.result{width:min(560px,100%);background:var(--panel);border:2px solid rgba(166,92,255,.6);border-radius:20px;padding:clamp(14px,3vw,26px);text-align:center;display:grid;gap:10px}
.result h2{margin:0;font:400 clamp(26px,4.6vw,44px)/1.1 var(--display);color:#fff;text-shadow:0 0 18px var(--violet)}
.rank{font:400 clamp(60px,10vw,96px)/1 var(--display);color:var(--gold);text-shadow:0 0 24px rgba(255,210,63,.7)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:#1c1040;border-radius:12px;padding:8px 4px;font-size:12px;color:#cdb8ff}
.stats b{display:block;font:400 clamp(18px,2.8vw,26px)/1.2 var(--display);color:#fff;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sub2{border:2px solid var(--violet);background:#1c1040;color:#fff;border-radius:14px;padding:12px 18px;font:900 16px/1 var(--body)}
#rotate{position:fixed;inset:0;z-index:30;display:none;place-items:center;text-align:center;background:var(--night);padding:24px;font:900 20px/1.6 var(--body)}
#rotate .ph{width:70px;height:110px;border:5px solid var(--violet);border-radius:14px;margin:0 auto 18px;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{40%,70%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:820px){#rotate{display:grid}}
@media (max-height:500px){.card{grid-template-columns:1fr 1fr}.ghosts{display:none}.how{display:none}}
@media (max-width:640px) and (orientation:portrait){.card{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.sk.ready{animation:none}#rotate .ph{animation:none}}
</style>
</head>
<body>

<canvas id="cv" aria-label="ゲーム画面"></canvas>
<div class="sa" id="sa"></div>

<div id="skills" hidden>
  <button class="sk" id="sLight" aria-label="ライト（Zキー）"><div class="hex"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 9h8l3-3v12l-3-3H4z"/><path d="M18 8l3-2M18 12h4M18 16l3 2"/></svg></div><div class="cool"></div><span class="key">Z</span><span class="lbl">ライト</span></button>
  <button class="sk" id="sBell" aria-label="チャイム（Xキー）"><div class="hex"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3a1.5 1.5 0 0 1 1.5 1.5v.6A6 6 0 0 1 18 11v4l2 3H4l2-3v-4a6 6 0 0 1 4.5-5.9v-.6A1.5 1.5 0 0 1 12 3zm-2 16h4a2 2 0 0 1-4 0z"/></svg></div><div class="cool"></div><span class="key">X</span><span class="lbl">チャイム</span></button>
  <button class="sk" id="sSp" aria-label="スペシャル（Cキー）"><div class="hex"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 12a2 2 0 1 1 2 2 4 4 0 1 1-4-4 6 6 0 1 1-6 6"/></svg></div><div class="cool"></div><span class="key">C</span><span class="lbl">スペシャル</span></button>
</div>
<div id="tools" hidden>
  <button class="tb" id="bPause" aria-label="一時停止">Ⅱ</button>
  <button class="tb" id="bMute" aria-label="音のオンオフ">♪</button>
  <button class="tb" id="bReload" aria-label="リロード">↻</button>
</div>

<section class="screen" id="title">
  <div class="card">
    <div class="logo">
      <div class="ruby">よるのがっこう</div>
      <h1>おばけ第一小学校</h1>
      <div class="sub">夜の学校おばけポン！</div>
      <div class="ghosts">
        <span><i style="background:#e02838"></i>ランドセロ</span>
        <span><i style="background:#b07a45"></i>いすわらし</span>
        <span><i style="background:#8a7a9a"></i>つくえんぼ</span>
        <span><i style="background:#9aa0ad"></i>ロッカーだいおう</span>
      </div>
    </div>
    <div class="menu">
      <h2>むずかしさを えらんでね</h2>
      <div class="modes" role="group" aria-label="むずかしさ">
        <button class="mode" id="m-easy" data-m="easy" aria-pressed="false">かんたん<small>ハート5こ</small></button>
        <button class="mode" id="m-normal" data-m="normal" aria-pressed="true">ふつう<small>ハート3こ</small></button>
        <button class="mode" id="m-hard" data-m="hard" aria-pressed="false">むずかしい<small>はやい！</small></button>
      </div>
      <button class="go" id="start">スタート！</button>
      <ul class="how">
        <li><b>ねらってうつ</b>：クリック／タップ（おしっぱなしで れんしゃ）</li>
        <li><b>Z ライト</b>：てらした おばけが こおりつく</li>
        <li><b>X チャイム</b>：ぜんぶ ふきとばす</li>
        <li><b>C スペシャル</b>：ゲージ MAXで ぜんめつ！</li>
        <li><b>チャイムが なったら</b>：たましいを うって ふっかつを ふせごう</li>
      </ul>
      <div class="best" id="best"></div>
    </div>
  </div>
</section>

<section class="screen" id="pause" hidden>
  <div class="result">
    <h2>ひとやすみ</h2>
    <div class="row"><button class="go" id="resume">つづける</button><button class="sub2" id="quit">タイトルへ</button></div>
  </div>
</section>

<section class="screen" id="result" hidden>
  <div class="result">
    <h2 id="rTitle">ぜんぶ たいじ！</h2>
    <div class="rank" id="rRank">S</div>
    <div class="stats">
      <div>スコア<b id="rScore">0</b></div>
      <div>たいじした かず<b id="rKills">0</b></div>
      <div>さいだいコンボ<b id="rCombo">0</b></div>
    </div>
    <div class="best" id="rBest"></div>
    <div class="row"><button class="go" id="again">もういちど</button><button class="sub2" id="toTitle">タイトルへ</button></div>
  </div>
</section>

<div id="rotate"><div><div class="ph"></div>スマホを よこむきに してね</div></div>

<script>
"use strict";
const cv=document.getElementById('cv'),mainCtx=cv.getContext('2d');let ctx=mainCtx;
const spr=document.createElement('canvas'),sctx=spr.getContext('2d');let EMIT=null,grainPat=null;
const noiseC=document.createElement('canvas');noiseC.width=noiseC.height=160;
{const n=noiseC.getContext('2d'),d=n.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}n.putImageData(d,0,0);}
let seed=7;const rs=(a,b)=>{seed=(seed*16807)%2147483647;return a+(seed/2147483647)*(b-a);};
const bg=document.createElement('canvas'),bx=bg.getContext('2d');
let W=0,H=0,DPR=1,U=1,SA={t:0,r:0,b:0,l:0};
const coarse=matchMedia('(pointer:coarse)').matches;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const FD='"Dela Gothic One","Zen Maru Gothic",sans-serif',FB='"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif';

/* ===== 投影 ===== */
const P=z=>1/(1+3*z);
const HZ=()=>H*0.44;
function S(x,z,h){const p=P(z);return [W/2+x*W*0.5*p, HZ()+H*0.6*p-h*H*0.55*p];}

/* ===== 設定 ===== */
const TYPES={
  tsukue:{hp:3,spd:.085,size:1.15,pat:'straight',pts:150},
  randoseru:{hp:2,spd:.11,size:1,pat:'hop',pts:120},
  isu:{hp:2,spd:.12,size:.95,pat:'zigzag',pts:120},
  keshigomu:{hp:1,spd:.1,size:.6,pat:'dash',pts:100},
  pencup:{hp:2,spd:.1,size:.75,pat:'zigzag',pts:120,split:1},
  pen:{hp:1,spd:.2,size:.42,pat:'zigzag',pts:40,minor:1},
  scissors:{hp:2,spd:.13,size:.85,pat:'snip',pts:140},
  globe:{hp:3,spd:.075,size:.9,pat:'roll',pts:160},
  sheet:{hp:1,spd:.13,size:.8,pat:'float',pts:130,ghost:1},
  flask:{hp:1,spd:.09,size:.7,pat:'float',pts:100,boom:1},
  ball:{hp:1,spd:.12,size:.6,pat:'bounce',pts:110},
  tobibako:{hp:6,spd:.055,size:1.3,pat:'straight',pts:300},
  paper:{hp:1,spd:.32,size:.42,pat:'aim',pts:50,minor:1},
  locker:{hp:90,spd:0,size:2.7,pat:'boss',pts:5000,boss:1},
};
const DIFFS={
  easy:{hearts:5,spd:.75,time:25,label:'かんたん'},
  normal:{hearts:3,spd:1,time:0,label:'ふつうモード'},
  hard:{hearts:3,spd:1.3,time:-10,label:'むずかしい'},
};
const WAVES=[
  {place:'classroom',name:'5-1 きょうしつ',sub:'つくえ・ランドセル・いすが うごきだした！',goal:12,time:60,types:{randoseru:3,isu:3,tsukue:2,keshigomu:2},max:4,every:1.6},
  {place:'hallway',name:'2かい ろうか',sub:'ときどき ていでん！ Zの ライトで てらそう',goal:18,time:70,types:{sheet:4,randoseru:2,keshigomu:3,isu:1},max:5,every:1.3,blackout:1,chime:1},
  {place:'science',name:'りかしつ',sub:'みどりの フラスコを うつと だいばくはつ！',goal:22,time:70,types:{flask:4,globe:2,scissors:3,pencup:2,sheet:1},max:6,every:1.1,chime:1},
  {place:'gym',name:'たいいくかん',sub:'ボールが はねる！ とびばこは かたいぞ',goal:24,time:75,types:{ball:5,tobibako:1,scissors:2,sheet:2,randoseru:2},max:6,every:1.0,chime:1},
  {place:'boss',name:'5-1 きょうしつ ふたたび',sub:'ロッカーだいおうが あらわれた！',time:100,types:{randoseru:2,isu:2,keshigomu:2,sheet:1,paper:0},max:5,every:2.6,chime:1,boss:1},
];
const ROOMS={
  classroom:{zb:.85,ch:2,spawn:.8},
  boss:{zb:.85,ch:2,spawn:.8},
  hallway:{zb:3,ch:1.9,spawn:1.15},
  science:{zb:.9,ch:2,spawn:.85},
  gym:{zb:1.3,ch:3,spawn:1.15},
};

/* ===== 状態 ===== */
let state='title';
const G={t:0,enemies:[],parts:[],texts:[],souls:[],items:[],tracers:[],fallen:[],place:'classroom',shake:0,recoil:0,hurt:0,flash:0,bgmAcc:0,bgmStep:0};
const ptr={x:0,y:0,down:false,id:null};
let modeKey='normal';
try{const m=localStorage.getItem('obake1-mode');if(m&&DIFFS[m])modeKey=m;}catch(e){}

/* ===== 音 ===== */
let AC=null,master=null,muted=false,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}
}
function tone(f,d,type,v,slide,delay){
  if(!AC||muted)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,delay,fq){
  if(!AC||muted)return;const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq||1500;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.03);
}
function bell(f,delay,v){tone(f,1.6,'sine',v||.16,0,delay);tone(f*2.76,.7,'sine',(v||.16)*.25,0,delay);tone(f*2,.9,'sine',(v||.16)*.3,0,delay);}
const SFX={
  shoot(){tone(980,.07,'square',.045,.45);tone(1900,.04,'sine',.03,.6)},
  hit(){tone(520,.06,'triangle',.11,1.6)},
  pop(){tone(320,.14,'sine',.22,3.2);tone(880,.1,'triangle',.08,1.6,.04)},
  hurt(){tone(220,.35,'sawtooth',.14,.35);noise(.22,.14,0,900)},
  chime(){const n=[329.6,261.6,293.7,196,196,293.7,329.6,261.6];n.forEach((f,i)=>bell(f,i*.42,.13))},
  ding(){bell(1046,0,.18);bell(784,.12,.12)},
  light(){tone(180,.45,'sawtooth',.05,5);noise(.3,.06,0,4000)},
  special(){tone(110,1.2,'sawtooth',.12,8);noise(1,.18,0,2500);for(let i=0;i<6;i++)tone(660+i*120,.15,'triangle',.06,1.5,.15+i*.08)},
  reload(){tone(420,.05,'square',.06);tone(760,.06,'square',.06,1,.12)},
  boom(){noise(.45,.3,0,700);tone(130,.45,'sine',.3,.3)},
  revive(){tone(140,.7,'sawtooth',.12,.5);tone(147,.7,'sawtooth',.1,.5)},
  item(){tone(1200,.1,'triangle',.12);tone(1600,.18,'triangle',.12,1,.08)},
  soul(){tone(1500,.12,'sine',.1,1.5)},
  clear(){[523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',.12,1,i*.1))},
  start(){[392,523,659].forEach((f,i)=>tone(f,.18,'square',.06,1,i*.09))},
};
function bgm(dt){
  if(!AC||muted)return;
  const boss=G.wave&&G.wave.boss;const step=boss?.17:.22;G.bgmAcc+=dt;
  while(G.bgmAcc>=step){G.bgmAcc-=step;const i=G.bgmStep++%32;
    const bass=[110,0,165,0,131,0,165,0,98,0,147,0,117,0,147,0,110,0,165,0,131,0,175,0,104,0,156,0,123,0,156,0];
    if(bass[i])tone(bass[i]*(boss?.94:1),step*1.6,'triangle',.07);
    if(i%8===6)tone([880,831,784,740][(i/8|0)%4],.5,'sine',.025);
    if(boss&&i%4===0)noise(.06,.05,0,3000);
  }
}

/* ===== サイズ ===== */
function resize(){

    for(let x=-1;x<=1;x+=.1)line(S(x,zb,.45),S(x,zb,1.95),'rgba(0,0,0,.25)',3*U);

/* ===== ゲーム進行 ===== */
function newGame(){
  const d=DIFFS[modeKey];G.diff=d;G.score=0;G.hearts=d.hearts;G.maxHearts=d.hearts;G.maxCombo=0;G.totalKills=0;G.sp=0;G.parts=[];G.texts=[];
  G.lightCd=0;G.bellCd=0;startWave(0);
}
function startWave(i){
  const w=WAVES[i];G.wave=w;G.waveIdx=i;G.kills=0;G.goal=w.goal||0;G.time=w.time+G.diff.time;
  G.enemies=[];G.souls=[];G.items=[];G.fallen=[];G.tracers=[];G.spawnT=1.4;G.chimeT=w.boss?999:18;G.chime=null;
  G.blackT=w.blackout?9:Infinity;G.black=0;G.ammo=30;G.reload=0;G.combo=0;G.comboT=0;G.lightT=0;G.spT=0;G.inv=0;G.noHit=true;G.boss=null;G.rage=0;
  setPlace(w.place);state='intro';G.introT=2.8;SFX.start();showHUD(true);
}
function setPlace(p){if(G.place!==p){G.place=p;buildBg();}}
function pickType(types){let tot=0;for(const k in types)tot+=types[k];let r=Math.random()*tot;for(const k in types){r-=types[k];if(r<=0)return k;}return Object.keys(types)[0];}
function spawn(type,x,z,h){
  const T=TYPES[type];const sz=ROOMS[G.place].spawn;
  const e={type,T,hp:T.hp,max:T.hp,x:x!=null?x:rnd(-.85,.85),z:z!=null?z:sz,h:h||0,t:0,ph:rnd(0,6),vx:rnd(-.5,.5)||.3,stun:0,flash:0,appear:0,rot:0,vis:1,atk:2.5,sx:0,sy:0,sr:0};
  if(type==='locker'){e.x=0;e.z=.62;G.boss=e;}
  G.enemies.push(e);puff(e,10,'#b47cff');return e;
}
function alive(){let n=0;for(const e of G.enemies)if(!e.dead&&!e.T.boss&&!e.T.minor)n++;return n;}

function update(dt){
  G.t+=dt;
  if(state==='pause')return;
  updFx(dt);
  if(state==='title'){demo(dt);return;}
  if(state==='result')return;
  bgm(dt);
  if(state==='intro'){G.introT-=dt;if(G.introT<=0){state='play';if(G.wave.boss){spawn('locker');addText(W/2,H*.4,'ロッカーだいおう!','#ff5fb8',48);G.shake=.6;SFX.boom();}}updEnemies(dt,false);return;}
  if(state==='clear'){G.clearT-=dt;if(G.clearT<=0){if(G.waveIdx+1<WAVES.length)startWave(G.waveIdx+1);else finish(true);}return;}
  // play
  G.time-=dt;if(G.time<=0){G.time=0;finish(false,'じかんぎれ…');return;}
  G.inv-=dt;G.lightCd-=dt;G.bellCd-=dt;G.reload>0&&(G.reload-=dt,G.reload<=0&&(G.ammo=30,SFX.reload()));
  if(G.lightT>0)G.lightT-=dt;
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}
  G.fireCd=(G.fireCd||0)-dt;
  if(ptr.down&&G.fireCd<=0)fire();
  // 出現
  const w=G.wave;G.spawnT-=dt;
  const need=w.boss?99:G.goal-G.kills-alive();
  if(G.spawnT<=0){G.spawnT=w.every*rnd(.7,1.2)/(G.diff.spd*.6+.4);if(alive()<w.max&&need>0)spawn(pickType(w.types));}
  // 停電
  if(w.blackout){G.blackT-=dt;if(G.blackT<=0){if(G.black>0){G.black=0;G.blackT=12;}else{G.black=6;G.blackT=6;addText(W/2,H*.3,'ていでん！ Zで ライト！','#ffe9a8',34);SFX.revive();}}if(G.black>0)G.black-=dt;}
  // チャイム
  if(w.chime&&!G.chime){G.chimeT-=dt;if(G.chimeT<=0){if(G.fallen.length>=2)startChime();else G.chimeT=4;}}
  if(G.chime)updChime(dt);
  updEnemies(dt,true);
  // スペシャル演出
  if(G.spT>0)G.spT-=dt;
  // クリア判定
  if(!w.boss&&G.kills>=G.goal)waveClear();
  if(w.boss&&G.boss&&G.boss.dead)waveClear();
  syncSkills();
}
function demo(dt){
  setPlace('classroom');G.spawnT=(G.spawnT||0)-dt;
  if(G.spawnT<=0){G.spawnT=1.8;if(G.enemies.length<5)spawn(pickType({randoseru:2,isu:2,tsukue:1,sheet:1,keshigomu:1}),null,.8);}
  G.diff=G.diff||DIFFS.normal;updEnemies(dt,false);
}
function inLight(e){if(G.lightT<=0)return false;return Math.hypot(e.sx-ptr.x,e.sy-ptr.y)<lightR()+e.sr*.5;}
function lightR(){return (G.lightT>0?210:G.black>0?80:0)*U*(coarse?1.15:1);}
function updEnemies(dt,live){
  const sm0=(G.diff?G.diff.spd:1);
  for(const e of G.enemies){
    if(e.dead)continue;e.t+=dt;e.appear=Math.min(1,e.appear+dt*2.5);e.flash-=dt;e.stun-=dt;
    const lit=inLight(e);
    let sm=sm0*(e.stun>0?0:1)*(lit?0:1)*(G.lightT>0?.6:1);
    const T=e.T,spd=T.spd*sm;
    switch(T.pat){
      case'straight':e.z-=spd*dt;break;
      case'zigzag':e.z-=spd*dt;e.x+=Math.cos(e.t*2.2+e.ph)*.55*dt*(sm?1:0);break;
      case'hop':e.z-=spd*dt*(Math.abs(Math.sin(e.t*4+e.ph))>.5?1.6:.3);e.h=Math.abs(Math.sin(e.t*4+e.ph))*.22;break;
      case'dash':{const c=(e.t+e.ph)%1.6;e.z-=spd*dt*(c<1.05?.25:3.4);break;}
      case'snip':e.z-=spd*dt*(Math.sin(e.t*3+e.ph)>0?1.5:.5);e.x+=Math.cos(e.t*3.5+e.ph)*.7*dt*(sm?1:0);break;
      case'roll':e.z-=spd*dt;e.x+=e.vx*dt*(sm?1:0);if(e.x>.92||e.x<-.92)e.vx*=-1;e.rot+=e.vx*dt*4;break;
      case'float':e.z-=spd*dt;e.h=.35+Math.sin(e.t*2+e.ph)*.12;e.x+=Math.sin(e.t*1.3+e.ph)*.4*dt*(sm?1:0);break;
      case'bounce':e.z-=spd*dt;e.h=Math.abs(Math.sin(e.t*3+e.ph))*.75;e.rot+=dt*3;break;
      case'aim':e.z-=spd*dt;e.x+=(0-e.x)*dt*.8;e.h=Math.max(.1,e.h-dt*.1);e.rot+=dt*2;break;
      case'boss':bossAI(e,dt,live);break;
    }
    e.x=clamp(e.x,-1,1);
    if(T.ghost){e.vis=(G.lightT>0||lit)?1:.22+.18*Math.abs(Math.sin(e.t*3+e.ph));}
    if(!T.boss&&e.z<=.03){if(live)bite(e);else{e.dead=true;puff(e,8,'#b47cff');}}
  }
  G.enemies=G.enemies.filter(e=>!e.dead||e.deadT>0);
  // 画面座標
  for(const e of G.enemies){const p=P(e.z);const u=e.T.size*H*.12*p*(.4+.6*e.appear);const fl=S(e.x,e.z,e.h);e.sx=fl[0];e.sy=fl[1]-u;e.sr=u*1.05;e.u=u;}
  for(const s of G.souls){s.t+=dt;s.h=.3+Math.sin(s.t*2.4+s.ph)*.15;s.x+=Math.sin(s.t*1.7+s.ph)*.15*dt;const p=P(s.z);const fl=S(s.x,s.z,s.h);s.u=H*.045*p*1.4+6*U;s.sx=fl[0];s.sy=fl[1]-s.u;}
  for(const it of G.items){it.t+=dt;it.z-=.05*dt;it.h=.5+Math.sin(it.t*3)*.08;const p=P(it.z);const fl=S(it.x,it.z,it.h);it.u=H*.06*p*1.3+8*U;it.sx=fl[0];it.sy=fl[1]-it.u;if(it.z<.1)it.gone=true;}
  G.items=G.items.filter(i=>!i.gone);
}
function bossAI(e,dt,live){
  e.x=Math.sin(e.t*.5)*.55;e.z=.62;e.h=.04+Math.sin(e.t*2)*.03;
  if(!live||e.stun>0)return;
  e.atk-=dt;const r=e.hp/e.max;
  if(r<.66&&G.rage<1){G.rage=1;rageUp();}
  if(r<.33&&G.rage<2){G.rage=2;rageUp();}
  if(e.atk<=0){e.atk=(G.rage===2?1.3:G.rage?1.9:2.6)/G.diff.spd;e.mouth=.6;
    if(Math.random()<.55){const n=G.rage===2?3:G.rage?2:1;for(let i=0;i<n;i++){const p=spawn('paper',e.x+rnd(-.25,.25),e.z-.04,.4);p.appear=.6;}addText(e.sx,e.sy-e.u,'テストこうげき!','#fff',20);}
    else if(alive()<G.wave.max)spawn(pickType(G.wave.types),e.x+rnd(-.3,.3),e.z-.03);}
  if(e.mouth>0)e.mouth-=dt;
}
function rageUp(){G.shake=.8;SFX.boom();addText(W/2,H*.32,'ロッカーだいおうが おこった！','#ff5fb8',34);G.fallen.push('randoseru','isu','sheet');startChime();}
function bite(e){
  e.dead=true;puff(e,16,'#ff5fb8');
  if(G.inv>0)return;
  G.hearts--;G.inv=1.2;G.shake=.5;G.hurt=1;G.combo=0;G.noHit=false;SFX.hurt();
  addText(W/2,H*.62,'ガブッ!','#ff5fb8',54);
  if(G.hearts<=0)finish(false,'やられた…');
}
function startChime(){
  const list=G.fallen.splice(0,6);if(!list.length)return;
  G.chime={t:5.5,max:5.5};G.chimeT=22;
  for(const type of list)G.souls.push({type,x:rnd(-.8,.8),z:rnd(.35,.7),h:.3,t:0,ph:rnd(0,6)});
  SFX.chime();addText(W/2,H*.3,'チャイムで ふっかつ！ たましいを うて！','#ffd23f',30);
}
function updChime(dt){
  G.chime.t-=dt;
  if(G.souls.length===0){G.chime=null;G.score+=500;addText(W/2,H*.35,'ぜんぶ じょうぶつ！ +500','#5fe3ff',36);SFX.clear();return;}
  if(G.chime.t<=0){SFX.revive();for(const s of G.souls){const e=spawn(s.type,s.x,s.z);e.appear=.3;addText(s.sx,s.sy,'ふっかつ!','#ff5fb8',22);}G.souls=[];G.chime=null;G.shake=.3;}
}
function waveClear(){
  if(state!=='play')return;
  for(const e of G.enemies)if(!e.dead){e.dead=true;puff(e,10,'#b47cff');}
  G.souls=[];G.chime=null;G.items=[];
  const tb=Math.ceil(G.time)*50;G.score+=tb;G.clearInfo=[`タイムボーナス +${tb}`];
  if(G.noHit){G.score+=1000;G.clearInfo.push('ノーダメージ +1000');}
  if(G.hearts<G.maxHearts&&G.waveIdx+1<WAVES.length){G.hearts++;G.clearInfo.push('ハート +1');}
  state='clear';G.clearT=3;SFX.clear();
}
function finish(win,msg){
  state='result';showHUD(false);ptr.down=false;
  let best=0;try{best=+localStorage.getItem('obake1-best')||0;if(G.score>best)localStorage.setItem('obake1-best',G.score);}catch(e){}
  const rank=!win?(G.score>=20000?'B':'C'):G.score>=42000?'S':G.score>=30000?'A':'B';
  $('rTitle').textContent=win?'ぜんぶ たいじ！':msg;$('rRank').textContent=rank;
  $('rScore').textContent=G.score.toLocaleString();$('rKills').textContent=G.totalKills;$('rCombo').textContent=G.maxCombo;
  $('rBest').textContent=G.score>best?'ハイスコア こうしん！':`ハイスコア ${best.toLocaleString()}`;
  $('result').hidden=false;if(win)SFX.clear();
}

/* ===== 射撃 ===== */
function fire(){
  if(G.reload>0)return;
  if(G.ammo<=0){startReload();return;}
  G.ammo--;G.fireCd=.11;G.recoil=1;SFX.shoot();
  const mz=muzzle();G.tracers.push({x0:mz[0],y0:mz[1],x1:ptr.x,y1:ptr.y,t:.09});
  const asst=coarse?1.3:1.08;
  for(const s of G.souls){if(Math.hypot(s.sx-ptr.x,s.sy-ptr.y)<s.u*1.6*asst){s.hit=true;spark(s.sx,s.sy,'#9fefff',14);SFX.soul();G.score+=50;addText(s.sx,s.sy,'じょうぶつ!','#9fefff',18);}}
  G.souls=G.souls.filter(s=>!s.hit);
  for(const it of G.items){if(Math.hypot(it.sx-ptr.x,it.sy-ptr.y)<it.u*1.4*asst){it.gone=true;getItem(it);}}
  let best=null;
  for(const e of G.enemies){if(e.dead)continue;const d=Math.hypot(e.sx-ptr.x,e.sy-ptr.y);if(d<e.sr*asst&&(!best||e.z<best.z))best=e;}
  if(best){damage(best,inLight(best)?2:1);ring(ptr.x,ptr.y,'#5fe3ff');}
  else ring(ptr.x,ptr.y,'rgba(95,227,255,.5)',.5);
  if(G.ammo<=0)startReload();
}
function startReload(){if(G.reload>0||G.ammo>=30)return;G.reload=1.1;tone(300,.08,'square',.05);}
function damage(e,d){
  if(e.dead)return;e.hp-=d;e.flash=.12;SFX.hit();
  if(!e.T.boss)e.z=Math.min(e.z+.02,ROOMS[G.place].spawn);
  spark(e.sx,e.sy,'#fff',5);
  if(e.hp<=0)kill(e);
}
function kill(e){
  e.dead=true;SFX.pop();
  G.combo++;G.comboT=1.8;G.maxCombo=Math.max(G.maxCombo,G.combo);
  const mul=1+Math.min(3,Math.floor(G.combo/5)*.5);const pts=Math.round(e.T.pts*mul);G.score+=pts;
  G.sp=Math.min(100,G.sp+(e.T.minor?2:7)+Math.min(5,G.combo*.3));
  puff(e,22,'#b47cff');spark(e.sx,e.sy,'#ffd23f',10);
  addText(e.sx,e.sy-e.u*.6,'ポン!','#fff',26*Math.max(.7,e.u/(60*U)));addText(e.sx,e.sy+e.u*.2,'+'+pts,'#ffd23f',18);
  if(!e.T.minor&&!e.T.boss){G.kills++;G.totalKills++;G.fallen.push(e.type);if(G.fallen.length>8)G.fallen.shift();}
  if(e.T.boss){G.totalKills++;G.shake=1.2;for(let i=0;i<5;i++)setTimeout(()=>{spark(e.sx+rnd(-e.u,e.u),e.sy+rnd(-e.u,e.u),'#ff5fb8',30);SFX.boom();},i*160);}
  if(e.T.split)for(let i=0;i<3;i++){const p=spawn('pen',e.x+(i-1)*.15,e.z+.02,.3);p.appear=.7;}
  if(e.T.boom){SFX.boom();G.shake=Math.max(G.shake,.35);boomFx(e.sx,e.sy,e.u*3.4);
    for(const o of G.enemies){if(o===e||o.dead)continue;if(Math.hypot(o.sx-e.sx,o.sy-e.sy)<e.u*3.4+o.sr){if(o.T.boss)damage(o,4);else damage(o,3);}}
    addText(e.sx,e.sy-e.u*1.4,'ドカーン!','#4dff9a',34);}
  if(!e.T.minor&&!e.T.boss){const r=Math.random();if(r<.07&&G.hearts<G.maxHearts)G.items.push({kind:'candy',x:e.x,z:e.z,t:0});else if(r<.13)G.items.push({kind:'clock',x:e.x,z:e.z,t:0});}
  if(G.combo%10===0&&G.combo)addText(W/2,H*.24,`${G.combo} コンボ!`,'#ffd23f',40);
}
function getItem(it){SFX.item();if(it.kind==='candy'){G.hearts=Math.min(G.maxHearts,G.hearts+1);addText(it.sx,it.sy,'ハート +1','#ff5fb8',24);}else{G.time+=5;addText(it.sx,it.sy,'タイム +5','#5fe3ff',24);}spark(it.sx,it.sy,'#fff',14);}

/* ===== スキル ===== */
function skillLight(){if(state!=='play'||G.lightCd>0)return;G.lightT=5;G.lightCd=14;SFX.light();addText(W/2,H*.3,'ライト！ てらすと こおりつく','#ffe9a8',28);}
function skillBell(){if(state!=='play'||G.bellCd>0)return;G.bellCd=20;SFX.ding();G.bellFx=1;G.shake=.4;
  for(const e of G.enemies){if(e.dead)continue;if(e.T.boss){damage(e,3);e.stun=1.2;continue;}e.z=Math.min(ROOMS[G.place].spawn,e.z+.3);e.stun=1.6;damage(e,1);}
  addText(W/2,H*.3,'キーンコーン！ ふきとばし！','#ffd23f',30);}
function skillSp(){if(state!=='play'||G.sp<100)return;G.sp=0;G.spT=1.6;SFX.special();G.shake=1;G.flash=1;
  for(const e of G.enemies){if(e.dead)continue;if(e.T.boss)damage(e,Math.ceil(e.max*.12));else damage(e,99);}
  for(const s of G.souls){spark(s.sx,s.sy,'#9fefff',10);G.score+=50;}G.souls=[];
  addText(W/2,H*.4,'おばけ ポーン!!','#e0a8ff',64);}
function syncSkills(){
  const set=(id,cd,ready)=>{const b=$(id);b.style.setProperty('--cd',clamp(cd,0,1));b.classList.toggle('ready',ready);};
  set('sLight',G.lightCd/14,G.lightCd<=0);set('sBell',G.bellCd/20,G.bellCd<=0);set('sSp',1-G.sp/100,G.sp>=100);
}

/* ===== エフェクト ===== */
function puff(e,n,col){for(let i=0;i<n;i++){const a=rnd(0,6.3),s=rnd(30,160)*U;G.parts.push({x:e.sx||W/2,y:e.sy||H/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40*U,life:rnd(.4,.8),max:.8,col,sz:rnd(6,16)*U*Math.max(.5,(e.u||40)/(60*U)),k:'smoke'});}}

  // チャイム波動・スペシャル
  if(G.bellFx>0){ctx.save();ctx.strokeStyle=`rgba(255,210,63,${G.bellFx})`;ctx.lineWidth=10*U;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W/2,H*.9,(1-G.bellFx)*W*(.6+i*.2),0,7);ctx.stroke();}ctx.restore();}
  if(G.spT>0){ctx.save();ctx.translate(W/2,H*.45);ctx.rotate(G.t*6);ctx.globalCompositeOperation='lighter';const k=G.spT/1.6;for(let i=0;i<5;i++){ctx.rotate(1.256);ctx.strokeStyle=`rgba(190,110,255,${k*.6})`;ctx.lineWidth=26*U*k;ctx.beginPath();for(let r=0;r<Math.max(W,H);r+=12){const a=r*.012;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.stroke();}ctx.restore();}
  if(state!=='title'&&state!=='result')drawGun();
  ctx.restore();
  // テキスト
  for(const t of G.texts){const a=Math.min(1,t.life/t.max*2);ctx.globalAlpha=a;const sc=1+Math.max(0,(t.life-t.max+.15))*3;txt(t.txt,t.x,t.y,t.size*sc,t.col,FD,'center',Math.max(3,t.size*.18));}
  ctx.globalAlpha=1;
  if(state==='play'||state==='intro'||state==='clear'||state==='pause')drawHUD();
  if(state==='play'||state==='intro')drawReticle();
  // ダメージ（紫のふち）
  if(G.hurt>0){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'rgba(255,60,170,0)');g.addColorStop(1,`rgba(255,60,170,${G.hurt*.55})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  if(G.flash>0){ctx.fillStyle=`rgba(255,240,255,${G.flash*.6})`;ctx.fillRect(0,0,W,H);}
  if(!grainPat)grainPat=mainCtx.createPattern(noiseC,'repeat');
  ctx.save();ctx.globalAlpha=.028;ctx.translate(rnd(-160,0),rnd(-160,0));ctx.fillStyle=grainPat;ctx.fillRect(0,0,W+160,H+160);ctx.restore();
  if(state==='intro')drawIntro();
  if(state==='clear')drawClear();
}
function liveBg(){
  const p=G.place;
  if(p==='classroom'||p==='boss'){const zb=ROOMS[p].zb;const c=S(-.05,zb,.95);const s=H*.55*P(zb);const a=(p==='boss'?.55:.25)+.25*Math.sin(G.t*1.6);
    ctx.save();ctx.globalAlpha=Math.max(0,a);ctx.shadowColor='#ff3fa0';ctx.shadowBlur=20*U;ctx.fillStyle='#ff4fb0';
    for(const sd of[-1,1]){ctx.beginPath();ctx.moveTo(c[0]+sd*s*.08,c[1]-s*.02);ctx.lineTo(c[0]+sd*s*.38,c[1]-s*.14);ctx.lineTo(c[0]+sd*s*.32,c[1]+s*.04);ctx.closePath();ctx.fill();}
    ctx.strokeStyle='#ff4fb0';ctx.lineWidth=4*U;ctx.beginPath();for(let i=0;i<=8;i++){const x=c[0]-s*.3+i*s*.075,y=c[1]+s*.18+(i%2?-s*.05:s*.05);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();ctx.restore();}
  if(Math.sin(G.t*13)>.985||(Math.sin(G.t*.7)>.97&&Math.random()<.4)){ctx.fillStyle='rgba(4,2,14,.35)';ctx.fillRect(0,0,W,H);}
  if(p==='boss'){ctx.fillStyle=`rgba(120,0,80,${.12+.06*Math.sin(G.t*2)})`;ctx.fillRect(0,0,W,H);}
}
function drawIntro(){
  const k=G.introT,a=Math.min(1,(2.8-k)*3,k*2);ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(8,4,20,.55)';ctx.fillRect(0,H*.32,W,H*.3);
  const sl=(1-Math.min(1,(2.8-k)*2.5))*W*.2;
  txt(G.wave.boss?'BOSS WAVE':`WAVE ${G.waveIdx+1}`,W/2-sl,H*.38,26*U,'#ffd23f',FD,'center',5*U);
  txt(G.wave.name,W/2+sl,H*.46,58*U,'#fff',FD,'center',9*U);
  txt(G.wave.sub,W/2,H*.555,20*U,'#e8dcff',FB,'center',5*U);ctx.restore();
}
function drawClear(){ctx.save();ctx.fillStyle='rgba(8,4,20,.55)';ctx.fillRect(0,H*.3,W,H*.36);
  txt(G.waveIdx+1<WAVES.length?'WAVE CLEAR!':'ぜんぶ たいじ！',W/2,H*.4,56*U,'#ffd23f',FD,'center',9*U);
  (G.clearInfo||[]).forEach((s,i)=>txt(s,W/2,H*.5+i*30*U,20*U,'#fff',FB,'center',5*U));ctx.restore();}

/* ===== 入力 ===== */
function setPtr(e){ptr.x=e.clientX;ptr.y=e.clientY;}
cv.addEventListener('pointerdown',e=>{initAudio();e.preventDefault();
  if(e.button===2){if(state==='play')startReload();return;}
  if(ptr.id!==null&&ptr.down&&e.pointerType==='touch')return;
  ptr.id=e.pointerId;setPtr(e);
  if(state==='play'){ptr.down=true;if((G.fireCd||0)<=0)fire();}
  try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(ptr.id===null||e.pointerId===ptr.id||e.pointerType==='mouse')setPtr(e);});
const up=e=>{if(e.pointerId===ptr.id){ptr.down=false;ptr.id=null;}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(state==='play'){if(k==='z')skillLight();else if(k==='x')skillBell();else if(k==='c')skillSp();else if(k==='r')startReload();else if(k===' '){ptr.down=true;e.preventDefault();}}
  if(k==='p'||k==='escape')togglePause();if(k==='m')toggleMute();});
addEventListener('keyup',e=>{if(e.key===' ')ptr.down=false;});
function bindSkill(id,fn){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();initAudio();fn();});b.addEventListener('keydown',e=>{if(e.key==='Enter'){fn();}});}
bindSkill('sLight',skillLight);bindSkill('sBell',skillBell);bindSkill('sSp',skillSp);
$('bReload').addEventListener('pointerdown',e=>{e.stopPropagation();if(state==='play')startReload();});
$('bPause').addEventListener('click',togglePause);$('bMute').addEventListener('click',toggleMute);
function togglePause(){if(state==='play'||state==='intro'){G.prev=state;state='pause';ptr.down=false;$('pause').hidden=false;}else if(state==='pause'){state=G.prev||'play';$('pause').hidden=true;}}
function toggleMute(){muted=!muted;$('bMute').textContent=muted?'×':'♪';$('bMute').setAttribute('aria-pressed',muted);}
function showHUD(on){$('skills').hidden=!on;$('tools').hidden=!on;}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{modeKey=b.dataset.m;document.querySelectorAll('.mode').forEach(o=>o.setAttribute('aria-pressed',o===b));try{localStorage.setItem('obake1-mode',modeKey);}catch(e){}}));
document.querySelectorAll('.mode').forEach(o=>o.setAttribute('aria-pressed',o.dataset.m===modeKey));
function begin(){initAudio();$('title').hidden=true;$('result').hidden=true;$('pause').hidden=true;G.enemies=[];newGame();
  try{if(coarse&&document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}}
$('start').addEventListener('click',begin);$('again').addEventListener('click',begin);
function toTitle(){state='title';G.enemies=[];G.souls=[];G.items=[];G.boss=null;G.wave=null;showHUD(false);$('pause').hidden=true;$('result').hidden=true;$('title').hidden=false;showBest();}
$('toTitle').addEventListener('click',toTitle);$('quit').addEventListener('click',toTitle);$('resume').addEventListener('click',togglePause);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='intro'))togglePause();});
function showBest(){let b=0;try{b=+localStorage.getItem('obake1-best')||0;}catch(e){}$('best').textContent=b?`ハイスコア ${b.toLocaleString()}`:'';}

/* ===== 起動 ===== */
addEventListener('resize',resize);
resize();showBest();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>buildBg());
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;try{update(dt);render();}catch(err){console.error(err);}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
