<title>おばけ第一小学校 レトロ（Pyxel版）</title>
<style>
/* 横向き対応：ゲーム画面（16:9）を画面いっぱいに。たて向きのスマホでは「よこむきに してね」を出す */
html,body{margin:0;height:100%;overflow:hidden;background:#0b0820;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
html body div#pyxel-screen{position:fixed;inset:0;width:auto;height:auto;background:#0b0820}
#rot{position:fixed;inset:0;z-index:50;display:none;place-items:center;text-align:center;background:#0b0820;color:#f4f1ff;
  font:900 22px/1.6 "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;padding:24px}
#rot .ph{width:56px;height:96px;margin:0 auto 18px;border:5px solid #a65cff;border-radius:12px;position:relative;animation:turn 2s ease-in-out infinite}
#rot .ph::after{content:"";position:absolute;left:50%;bottom:6px;width:12px;height:4px;margin-left:-6px;border-radius:2px;background:#a65cff}
#rot small{display:block;font-size:13px;font-weight:700;color:#bda9f0;margin-top:10px}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait) and (pointer:coarse){#rot{display:grid}}
#fs{position:fixed;right:6px;bottom:6px;z-index:40;
  width:40px;height:40px;border-radius:10px;border:2px solid #a65cff;background:rgba(11,8,32,.7);color:#fff;font:700 18px/1 sans-serif;opacity:.6}
#fs[hidden]{display:none}
#tip{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:45;max-width:92vw;padding:8px 14px;border-radius:12px;border:2px solid #a65cff;
  background:rgba(11,8,32,.88);color:#f4f1ff;font:700 13px/1.5 "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;text-align:center;pointer-events:none;transition:opacity .6s}
#tip[hidden]{display:none}
</style>
</head>
<body>
<div id="rot"><div><div class="ph"></div>スマホを よこむきに してね<small>よこむきだと 画面いっぱいで あそべるよ</small></div></div>
<button id="fs" hidden aria-label="ぜんがめん">⛶</button>
<div id="tip" hidden>ぜんがめんで あそぶには：共有ボタン（□↑）→「ホーム画面に追加」→ ホーム画面の アイコンから ひらいてね</div>
<script>
// 全画面ボタン：全画面にできるブラウザ（Android・iPad・パソコン）だけに出す。iPhoneのSafariは非対応なので出さない
(function(){
  var el=document.documentElement,b=document.getElementById('fs');
  var req=el.requestFullscreen||el.webkitRequestFullscreen;
  // iPhone：全画面APIがないので、ホーム画面に追加して開く方法を数秒だけ案内（ホーム画面から開いたときは出さない）
  var standalone=navigator.standalone||matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches;
  if(!req&&!standalone&&/iPhone|iPod/.test(navigator.userAgent)){
    var t=document.getElementById('tip');t.hidden=false;
    setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.hidden=true;},700);},9000);
  }
  if(!req)return;
  b.hidden=false;
  b.addEventListener('click',function(e){e.stopPropagation();
    if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
    var p=req.call(el);
    if(p&&p.then)p.then(function(){try{screen.orientation.lock('landscape');}catch(_){}}).catch(function(){});
  });
})();
// たて→よこにしたとき、表示サイズを確実に合わせなおす
addEventListener('orientationchange',function(){setTimeout(function(){dispatchEvent(new Event('resize'));},300);});
</script>
