<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>おばけ第一小学校 コントローラー</title>
<link rel="icon" href="assets/icon_32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon_180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* iPhone用コントローラー（光線銃スタイル）。
   iPhoneの「あたま」をテレビに向けると、その方向に照準が出る。画面は見なくても押せる大きなボタンだけ */
:root{color-scheme:dark;--night:#0d0a1f;--panel:rgba(22,12,44,.92);--violet:#a65cff;--cyan:#5fe3ff;--gold:#ffd23f;--pink:#ff5fb8;--chalk:#f4f1ff;--ink:#1a0b25;
  --display:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;--body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--chalk);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 30%,#2a1458,#0d0a1f 70%)}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
.wrap{position:fixed;inset:0;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 10px);display:grid;grid-template-rows:auto auto 1fr;gap:8px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stat{flex:1 1 100%;order:9;font:900 14px/1.3 var(--body);color:#d9ccff;min-height:1.3em}
.stat b{color:var(--cyan)}
.tb{height:44px;min-width:48px;padding:0 10px;border-radius:12px;border:2px solid var(--violet);background:#1c1040;color:#fff;font:900 15px/1 var(--body)}
.mini{position:relative;width:96px;height:54px;border:3px solid #5fe3ff;border-radius:6px;background:#1c1040;flex:none}
.mini.off{border-color:#ff5f5f;background:#3a1030}
.mini b{position:absolute;left:0;right:0;bottom:-16px;font:900 10px/1 var(--body);color:#ff8f8f;text-align:center;white-space:nowrap}
.mini i{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);left:50%;top:50%}
.hearts{font:900 15px/1 var(--body);color:var(--pink);flex:1;text-align:right;white-space:nowrap}
.ammo{height:12px;border-radius:6px;background:#1c1040;border:2px solid #4b3487;overflow:hidden}
.ammo i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fe3ff,#9fefff);transition:width .2s}
.modes{display:flex;gap:6px;flex:1 1 100%;order:10}
.modes button{flex:1;border:2px solid #4b3487;background:#1c1040;color:#fff;border-radius:10px;padding:10px 4px;font:900 14px/1 var(--body)}
.modes button[aria-pressed="true"]{border-color:var(--gold);background:#3a2370}
/* たて持ち：上に「わざ」、親指の来る下半分に大きな「うつ」 */
.pads{display:grid;grid-template-rows:1fr 2fr;gap:10px;min-height:0}
@media (orientation:landscape){.pads{grid-template-rows:none;grid-template-columns:2fr 3fr}.wrap{grid-template-rows:auto 1fr}.ammo{display:none}}
.pad{position:relative;border:none;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 clamp(30px,11vw,64px)/1 var(--display);color:var(--ink);touch-action:none}
.pad small{display:block;font:900 clamp(12px,3.6vw,17px)/1.3 var(--body);margin-top:8px;color:rgba(26,11,37,.75)}
#skill{background:linear-gradient(180deg,#5b4a2a,#3a2f1c);color:#a8946a;box-shadow:inset 0 0 0 3px #6b5a33}
#skill.ready{background:linear-gradient(180deg,#fff27a,#ffb22e);color:var(--ink);box-shadow:0 6px 0 #a8580c,0 0 30px rgba(255,200,60,.6)}
#skill:not(.ready) small{color:#a8946a}
#fire{background:linear-gradient(180deg,#9ff6ff,#3fb7e0);box-shadow:0 6px 0 #1b6f93,0 0 30px rgba(95,227,255,.5)}
.pad.on{transform:translateY(4px);filter:brightness(1.15)}
/* 接続・ねらい合わせの画面 */
.join{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 30%,#2a1458,#0d0a1f 70%);overflow:auto}
.card{width:min(560px,100%);background:var(--panel);border:2px solid rgba(166,92,255,.6);border-radius:20px;padding:20px;display:grid;gap:12px;text-align:center}
.card h1{margin:0;font:400 clamp(22px,6vw,32px)/1.2 var(--display);color:#fff;text-shadow:0 0 18px var(--violet)}
.card p{margin:0;font:700 14px/1.6 var(--body);color:#d9ccff}
.card ol{margin:0;padding-left:1.4em;text-align:left;font:900 15px/1.7 var(--body)}
.code{font:400 40px/1 var(--display);letter-spacing:.3em;text-align:center;width:6.5em;max-width:100%;margin:0 auto;padding:10px 0 10px .3em;border-radius:14px;border:2px solid var(--violet);background:#1c1040;color:var(--gold)}
.go{border:none;border-radius:16px;padding:18px;font:400 26px/1 var(--display);color:var(--ink);background:linear-gradient(180deg,#fff27a,#ffb22e);box-shadow:0 5px 0 #a8580c}
.go:disabled{opacity:.5}
.big{min-height:34vh;font-size:clamp(34px,12vw,60px);border-radius:28px}
.hold{display:grid;place-items:center}
.hold svg{width:min(60vw,220px);height:auto}
#msg{color:var(--cyan);min-height:1.6em}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="tb" id="bPause" aria-label="一時停止">Ⅱ</button>
    <button class="tb" id="bAim" aria-label="ねらいを あわせなおす">◎ あわせる</button>
    <button class="tb" id="bSens" aria-label="かんど">かんど ふつう</button>
    <div class="mini" id="mini" aria-label="しょうじゅんの いち"><i id="dot"></i><b id="offTxt" hidden>そとを むいてる</b></div>
    <div class="hearts" id="hearts"></div>
    <div class="stat" id="stat">つないでいます…</div>
    <div class="modes" id="modes" hidden>
      <button data-m="easy">かんたん</button><button data-m="normal">ふつう</button><button data-m="hard">むずかしい</button>
    </div>
  </div>
  <div class="ammo" aria-label="みずの のこり"><i id="ammo"></i></div>
  <div class="pads">
    <button class="pad" id="skill" aria-label="わざ">わざ<small>つかえる わざを だす</small></button>
    <button class="pad" id="fire" aria-label="うつ"><span id="fireLbl">うつ</span><small id="fireSub">おしっぱなしで れんしゃ</small></button>
  </div>
</div>

<section class="join" id="join">
  <div class="card">
    <h1>コントローラー</h1>
    <p>テレビ（Mac）に でている 4けたの ばんごうを いれてね</p>
    <input class="code" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="ばんごう">
    <button class="go" id="go">はじめる</button>
    <p id="msg"></p>
    <p style="font-size:12px;color:#bda9f0">「うごきと ほうこう」の きょかを きかれたら「許可」を おしてね。</p>
  </div>
</section>

<section class="join" id="aim" hidden>
  <div class="card">
    <h1>ねらいを あわせよう</h1>
    <div class="hold" aria-hidden="true">
      <!-- iPhoneの あたまを テレビへ向ける絵 -->
      <svg viewBox="0 0 220 120"><rect x="150" y="20" width="62" height="40" rx="6" fill="#1c1040" stroke="#a65cff" stroke-width="3"/><circle cx="181" cy="40" r="9" fill="none" stroke="#ffd23f" stroke-width="3"/><circle cx="181" cy="40" r="2.5" fill="#ffd23f"/><rect x="186" y="60" width="10" height="10" fill="#a65cff"/>
      <g transform="rotate(-8 60 80)"><rect x="18" y="66" width="96" height="40" rx="9" fill="#9ff6ff" stroke="#fff" stroke-width="3"/><circle cx="104" cy="86" r="3" fill="#1a0b25"/></g>
      <path d="M122 72 L168 44" stroke="#ffd23f" stroke-width="3" stroke-dasharray="6 6"/></svg>
    </div>
    <ol>
      <li>iPhoneを たてに もって、<b>あたま（上のはし）</b>を テレビに むける</li>
      <li>テレビに 出る <b style="color:var(--cyan)">水色の まる</b>を、まんなかの <b style="color:var(--gold)">◎</b> に かさねる</li>
      <li>そのまま「ここ！」を おす</li>
    </ol>
    <button class="go big" id="calBtn">ここ！</button>
    <p id="aimMsg"></p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const PEER_PREFIX='obake1sg-';
const qs=new URLSearchParams(location.search);
if(qs.get('c'))$('code').value=qs.get('c').replace(/\D/g,'').slice(0,4);
function peerOpts(){const q=qs.get('ps');if(!q)return {};const [h,pt]=q.split(':');return {host:h,port:+pt||9000,path:'/',secure:false};}
let lastRx=0,peer=null,conn=null,code='',motionOK=false,gotOri=false,wake=null,lastSend=0,want=false,shakeT=0;
const msg=t=>{$('msg').textContent=t;};
const stat=t=>{$('stat').innerHTML=t;};
function send(o){if(conn&&conn.open){try{conn.send(o);}catch(_){}}}

/* ===== むけて ねらう（光線銃方式） =====
   deviceorientation（alpha/beta/gamma）から、iPhoneが指している向き（ベクトル）を求める。
   ・たて持ちで あたまを向ける → 端末の +y 軸
   ・カメラのように画面を自分に向けて持つ → 端末の背面（-z 軸）
   どちらで持っているかは「ここ！」を押したときに決める。向きは絶対値なので、まんなかへ戻せば照準もまんなかへ戻る */
const D=Math.PI/180;
function pointVec(a,b,g,axis){const cA=Math.cos(a*D),sA=Math.sin(a*D),cB=Math.cos(b*D),sB=Math.sin(b*D),cG=Math.cos(g*D),sG=Math.sin(g*D);
  if(axis==='top')return [-sA*cB,cA*cB,sB];
  return [-(cA*sG+sA*sB*cG),-(sA*sG-cA*sB*cG),-cB*cG];}
function yawPit(v){return [Math.atan2(-v[0],v[1])/D,Math.asin(Math.max(-1,Math.min(1,v[2])))/D];}
const SENS=[['ひくい',30],['ふつう',22],['たかい',15]];let sens=1; // 画面の左右はしまでの角度（度）
try{const v=+localStorage.getItem('obake1-sens2');if(v>=0&&v<3)sens=v;}catch(_){}
let ori=null,cal=null,sm=null;
function onOri(e){if(e.alpha==null||e.beta==null)return;gotOri=true;motionOK=true;ori=[e.alpha,e.beta,e.gamma||0];
  if(!cal){const top=pointVec(ori[0],ori[1],ori[2],'top');const axis=Math.abs(top[2])<.8?'top':'back';const [y0,p0]=yawPit(pointVec(ori[0],ori[1],ori[2],axis));cal={axis,yaw:y0,pit:p0,temp:true};}
  const [yaw,pit]=yawPit(pointVec(ori[0],ori[1],ori[2],cal.axis));
  let dy=((cal.yaw-yaw+540)%360)-180,dp=pit-cal.pit;
  const fx=SENS[sens][1],fy=fx*.6;
  let x=Math.max(-1.3,Math.min(1.3,dy/fx)),y=Math.max(-1.3,Math.min(1.3,dp/fy));
  // 手ぶれを少しだけならす
  if(!sm)sm=[x,y];sm[0]+=(x-sm[0])*.55;sm[1]+=(y-sm[1])*.55;
  // 手もとの小窓に、照準の位置をすぐ出す（テレビを見なくても向きがわかる）
  const off=Math.abs(sm[0])>1.02||Math.abs(sm[1])>1.02;
  $('dot').style.left=(50+Math.max(-1,Math.min(1,sm[0]))*50)+'%';$('dot').style.top=(50-Math.max(-1,Math.min(1,sm[1]))*50)+'%';
  $('mini').classList.toggle('off',off);$('offTxt').hidden=!off;
  flushAim();}
let aimTimer=0;
function flushAim(){const now=performance.now(),w=16-(now-lastSend);
  if(w<=0){clearTimeout(aimTimer);aimTimer=0;send({t:'a',x:+sm[0].toFixed(4),y:+sm[1].toFixed(4)});lastSend=now;}
  else if(!aimTimer)aimTimer=setTimeout(()=>{aimTimer=0;flushAim();},w);}
function calibrate(){if(!ori){$('aimMsg').textContent='うごきが とれません。「許可」したか たしかめてね';return false;}
  const top=pointVec(ori[0],ori[1],ori[2],'top');
  const axis=Math.abs(top[2])<.8?'top':'back';
  const [yaw,pit]=yawPit(pointVec(ori[0],ori[1],ori[2],axis));cal={axis,yaw,pit};sm=null;
  send({t:'calmode',on:0});send({t:'a',x:0,y:0});return true;}
/* ふると「みずを いれる」（リロード）。ねらうときの動きでは起きないよう、強くふったときだけ */
function onMotion(ev){const a=ev.acceleration;if(!a||a.x==null)return;const m=Math.hypot(a.x,a.y,a.z);const now=performance.now();
  if(m>24&&now-shakeT>900){shakeT=now;send({t:'r'});}}

async function askMotion(){let ok=false;
  try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')return false;}}catch(e){return false;}
  try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){await DeviceMotionEvent.requestPermission();}}catch(e){}
  if(typeof DeviceOrientationEvent!=='undefined'){addEventListener('deviceorientation',onOri);ok=true;}
  if(typeof DeviceMotionEvent!=='undefined')addEventListener('devicemotion',onMotion);
  setTimeout(()=>{if(!gotOri)motionOK=false;},2500);return ok;}
async function keepAwake(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen');}catch(_){}}

function showAim(){$('aimMsg').textContent='';$('aim').hidden=false;send({t:'calmode',on:1});}
function connect(){
  if(typeof Peer==='undefined'){msg('つうしんの じゅんびが できませんでした（ネットを かくにんしてね）');return;}
  if(peer&&!peer.destroyed){try{peer.destroy();}catch(_){}}
  stat('つないでいます…');
  peer=new Peer(undefined,peerOpts());
  peer.on('open',()=>{const c=peer.connect(PEER_PREFIX+code,{serialization:'json',reliable:true});conn=c;
    c.on('open',()=>{if(c!==conn)return;lastRx=performance.now();$('join').hidden=true;stat('<b>つながった！</b> テレビを みてね');
      if(!cal&&typeof DeviceOrientationEvent!=='undefined')showAim();});
    c.on('data',d=>{if(c===conn)onData(d);});
    c.on('close',()=>{if(c===conn)lost();});c.on('error',()=>{if(c===conn)lost();});});
  peer.on('error',err=>{if(err.type==='peer-unavailable'){msg('ばんごうが みつかりません。テレビの ばんごうを たしかめてね');showJoin();}
    else{msg('つながりませんでした。もういちど「はじめる」を おしてね');showJoin();}});
}
function showJoin(){want=false;$('join').hidden=false;$('aim').hidden=true;$('go').disabled=false;}
function lost(){if(!conn)return;conn=null;stat('きれました。つなぎなおしています…');if(want)setTimeout(()=>{if(want&&!(conn&&conn.open))connect();},1200);}

/* Macから届く状態でボタンの表示を変える */
const LBL={title:['スタート','タップで はじめる'],route:['えらぶ','テレビの ひだり・みぎを ねらって おす'],result:['もういちど','タップで さいしょから'],pause:['つづける','タップで さいかい'],opening:['スキップ','タップで とばす'],ending:['スキップ','タップで とばす']};
function onData(d){lastRx=performance.now();if(!d||d.t!=='st')return;
  const l=LBL[d.s];$('fireLbl').textContent=l?l[0]:'うつ';$('fireSub').textContent=l?l[1]:(d.r?'みずを いれてるよ…':d.a===0?'ふって みずを いれよう！':'おしっぱなしで れんしゃ');
  $('skill').classList.toggle('ready',!!d.sk);
  $('ammo').style.width=(d.m?Math.round(100*d.a/d.m):0)+'%';
  $('hearts').textContent=d.s==='play'||d.s==='intro'||d.s==='clear'?'♥'.repeat(Math.max(0,d.h)):'';
  $('modes').hidden=d.s!=='title';
  if(d.x!=null&&!ori){$('dot').style.left=(d.x*100)+'%';$('dot').style.top=(d.y*100)+'%';}
  document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===d.md));
  stat(!motionOK?'むけて ねらう が つかえません（ボタンだけ）':d.s==='play'?'<b>たいじちゅう！</b> ずれたら「◎ あわせる」':d.s==='title'?'<b>つながった！</b> むずかしさを えらんで スタート':'<b>つながった！</b> テレビを みてね');}

/* ボタン：指ごとに押す・離すを管理（同時押しOK） */
function hold(el,down,up){const ids=new Set();
  el.addEventListener('pointerdown',e=>{e.preventDefault();ids.add(e.pointerId);try{el.setPointerCapture(e.pointerId);}catch(_){}el.classList.add('on');down();});
  const end=e=>{if(!ids.delete(e.pointerId))return;if(!ids.size){el.classList.remove('on');up&&up();}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end);}
hold($('fire'),()=>send({t:'f',d:1}),()=>send({t:'f',d:0}));
hold($('skill'),()=>send({t:'s'}));
const sensLbl=()=>{$('bSens').textContent='かんど '+SENS[sens][0];};sensLbl();
$('bSens').addEventListener('pointerdown',e=>{e.preventDefault();sens=(sens+1)%3;sensLbl();try{localStorage.setItem('obake1-sens2',sens);}catch(_){}});
$('bAim').addEventListener('pointerdown',e=>{e.preventDefault();send({t:'f',d:0});showAim();});
$('calBtn').addEventListener('pointerdown',e=>{e.preventDefault();if(calibrate())$('aim').hidden=true;});
$('bPause').addEventListener('pointerdown',e=>{e.preventDefault();send({t:'p'});});
document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();send({t:'mode',m:b.dataset.m});}));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

$('code').addEventListener('input',()=>{$('code').value=$('code').value.replace(/\D/g,'').slice(0,4);});
$('go').addEventListener('click',async()=>{
  code=$('code').value.replace(/\D/g,'');if(code.length!==4){msg('4けたの ばんごうを いれてね');return;}
  $('go').disabled=true;msg('つないでいます…');
  motionOK=await askMotion();if(!motionOK)msg('むけて ねらう が つかえません（ボタンだけ つかえます）');
  keepAwake();want=true;connect();});
/* 生きているかの合図（1秒ごと）。Macから10秒なにも来なければ、つなぎなおす */
setInterval(()=>{if(!conn||!conn.open)return;send({t:'hb'});if(!$('aim').hidden)send({t:'calmode',on:1});if(performance.now()-lastRx>10000){const c=conn;try{c.close();}catch(_){}lost();}},1000);
/* 画面を消してもどったとき：つなぎなおし・画面消灯防止のかけなおし */
document.addEventListener('visibilitychange',()=>{if(document.hidden){send({t:'f',d:0});return;}keepAwake();if(want&&!(conn&&conn.open))connect();});
</script>
</body>
</html>
